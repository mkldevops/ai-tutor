# yaml-language-server: $schema=https://json.schemastore.org/lefthook.json

output:
  - summary
  - failure

pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,json,jsonc,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  parallel: true
  jobs:
    - name: biome
      run: pnpm exec biome ci
    - name: typecheck
      run: pnpm typecheck
    - name: test
      run: pnpm test
